<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyMail Inbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>KeyMail Inbox</h1>
        </div>

        <div class="inbox">
            <div class="email-row" id="email-1">
                <div class="email-info">
                    <span>InstaGraph</span>
                    <span>Account Access</span>
                </div>
                <div class="email-action">Open</div>
            </div>
            <div class="email-row" id="email-2">
                <div class="email-info">
                    <span>InstaGraph - Urgent</span>
                    <span>Your Account is About to Be Locked</span>
                </div>
                <div class="email-action">Open</div>
            </div>
            <div class="email-row" id="email-3">
                <div class="email-info">
                    <span>FacePoke</span>
                    <span>Security Alert</span>
                </div>
                <div class="email-action">Open</div>
            </div>
            <div class="email-row" id="email-4">
                <div class="email-info">
                    <span>CodeHubb</span>
                    <span>New Repository Created</span>
                </div>
                <div class="email-action">Open</div>
            </div>
            <div class="email-row" id="email-5">
                <div class="email-info">
                    <span>CanNotVa</span>
                    <span>Your Design is Almost Ready</span>
                </div>
                <div class="email-action">Open</div>
            </div>
            <div class="email-row" id="email-6">
                <div class="email-info">
                    <span>FigMe</span>
                    <span>Design Changes Made</span>
                </div>
                <div class="email-action">Open</div>
            </div>
        </div>

        <div id="email-content" class="email-body">
            <h3>Select an email to view its content.</h3>
        </div>

        <div id="email-actions" class="email-actions" style="display: none;">
            <button id="reply-button">Reply</button>
            <button id="trash-button">Trash</button>
            <button id="spam-button">Spam</button>
        </div>

        <div id="action-alert" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
