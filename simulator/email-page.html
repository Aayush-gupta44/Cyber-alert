<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Content</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Email Content</h1>
        </div>

        <div id="email-content" class="email-body">
            <h3>Select an email to view its content.</h3>
        </div>

        <!-- Action Buttons -->
        <div id="email-actions" class="email-actions" style="display: none;">
            <button id="reply-button">Reply</button>
            <button id="trash-button">Trash</button>
            <button id="spam-button">Spam</button>
        </div>

        <div id="action-alert" style="display: none;"></div>
    </div>

    <script src="email-page.js"></script>
</body>
</html>
