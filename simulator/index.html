<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyMail Inbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>KeyMail Inbox</h1>
        </div>

        <div class="inbox">
            <div class="email-row" id="email-1">
                <div class="email-info">
                    <span>InstaGraph</span>
                    <span>Account Access</span>
                </div>
                <div class="email-action">
                    <a href="email-page.html?id=email-1" class="button">Open</a>
                </div>
            </div>
            <div class="email-row" id="email-2">
                <div class="email-info">
                    <span>InstaGraph - Urgent</span>
                    <span>Your Account is About to Be Locked</span>
                </div>
                <div class="email-action">
                    <a href="email-page.html?id=email-2" class="button">Open</a>
                </div>
            </div>
            <div class="email-row" id="email-3">
                <div class="email-info">
                    <span>FacePoke</span>
                    <span>Security Alert</span>
                </div>
                <div class="email-action">
                    <a href="email-page.html?id=email-3" class="button">Open</a>
                </div>
            </div>
            <!-- Add more email rows here as needed -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
