<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber4Life - Platform</title>
    <link rel="stylesheet" href="platform.css">
</head>
<body>

    <!-- Header will be loaded dynamically -->
    <div id="header-container"></div>

    <main class="content">
        <h1>Welcome to Cyber4Life Platform</h1>
        <p>Your one-stop solution for cybersecurity awareness, ethical hacking, and cyber defense learning.</p>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("home/common/header.html")  // Corrected path to header.html



                .then(response => response.text())
                .then(data => {
                    document.getElementById("header-container").innerHTML = data;
                    
                    // Load CSS dynamically for header
                    let headerStyles = document.createElement("link");
                    headerStyles.rel = "stylesheet";
                    headerStyles.href = "home/common/header.css";  // Ensure header CSS is linked
                    document.head.appendChild(headerStyles);

                    // Re-run scripts inside header.html
                    let script = document.createElement("script");
                    script.src = "home/common/header.js";  // Load header's JavaScript
                    document.body.appendChild(script);
                })
                .catch(error => console.error("Error loading header:", error));
        });
    </script>

    <script src="platform.js"></script>
    <script src="home/common/header.js"></script>  // Ensure header's JavaScript is loaded




</body>
</html>
