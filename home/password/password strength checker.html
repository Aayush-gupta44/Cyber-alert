<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <!-- Video background -->
    <video id="backgroundVideo" autoplay loop muted>
        <source src="Pass video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>
 
    <div class="container">
        <h1>Password Strength Checker</h1>
        
        <!-- Password input and visibility toggle -->
        <div class="password-input-container">
            <input type="password" id="passwordInput" placeholder="Enter your password">
            <button id="toggleVisibilityBtn">Show👁️ </button>
        </div>
        
        <!-- Strength meter bar -->
        <div class="strength-meter">
            <div class="strength-bar"></div>
        </div>
        
        <!-- Password strength text -->
        <p id="strengthText">Password Strength: Very Weak</p>

        <!-- Go Back button (styled like the Show/Hide button) -->
       <a href="../index.html"><button id="goBackBtn">Go Back</button></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
