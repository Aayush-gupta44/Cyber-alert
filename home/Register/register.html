<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register| My Cyber Shield</title>
    <link rel="icon" type="image/PNG" href="../Icon of page.png"> 
    <link rel="stylesheet" href="./register.css">
</head>
<body>
  

    <video autoplay loop muted class="background-video">
        <source src="background.mp4" type="video/mp4">
    </video>


    <div class="register-container">
        <h3>Register account</h3>
        <form>
            <div class="input-group">
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Enter Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter password" required>
                <button type="button" id="togglePassword" class="toggle-password">Show</button>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Confirm password" required>
                <button type="button" id="togglePassword2" class="toggle-password">Show</button>
            </div>
            <button type="submit" class="register-btn">Register</button>
        </form>
       
        <h5>Already have an account?
            <a href="../Login/login.html"><br>Login Here!</a>
         </h5>
    </div>
    
   <script src="./register.js"></script>
</body>
</html>
